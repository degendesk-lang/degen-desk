<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060610" />
  <title>Page not found - Degen Desk</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Degen Desk" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #060610;
      color: #f0f0f8;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(0, 255, 136, 0.10), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(255, 0, 200, 0.08), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(100, 120, 255, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      margin: 20px;
      background: linear-gradient(180deg, rgba(20, 20, 32, 0.6) 0%, rgba(10, 10, 20, 0.4) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.6), transparent);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 24px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15);
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      margin: 0 0 16px;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.25);
      border-radius: 999px;
      color: #ff8787;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .code {
      font-size: 88px;
      font-weight: 900;
      line-height: 1;
      margin: 0 0 4px;
      background: linear-gradient(135deg, #00ff88 0%, #6ba8ff 50%, #ff66cc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
      filter: drop-shadow(0 4px 20px rgba(0, 255, 136, 0.2));
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
      margin: 10px 0 12px;
      background: linear-gradient(135deg, #ffffff 0%, #b8b8d0 50%, #8a8a9e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      color: #8a8a9e;
      margin: 0 0 28px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00ff88 0%, #00d96f 100%);
      color: #060610;
      box-shadow: 0 8px 24px rgba(0, 255, 136, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(0, 255, 136, 0.35);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #e8e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .container { padding: 36px 22px; }
      .code { font-size: 68px; }
      h1 { font-size: 22px; }
      p { font-size: 14px; }
      .btn { padding: 12px 18px; font-size: 13.5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="favicon.png" alt="Degen Desk" class="logo" />
    <div class="eyebrow">Page not found</div>
    <div class="code">404</div>
    <h1>We can't find that page</h1>
    <p>The link you followed might be broken, or the page may have moved. Let's get you back to the charts.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Degen Desk
      </a>
      <a href="/pricing.html" class="btn btn-secondary">
        View Pricing
      </a>
    </div>
  </div>
</body>
</html>
