<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Signing in - Degen Desk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #060610;
      color: #f0f0f8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Ambient radial gradients — same treatment as privacy/terms/referrals */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(0, 255, 136, 0.10), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(255, 0, 200, 0.08), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(100, 120, 255, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 28px;
      max-width: 360px;
      width: 100%;
      background: linear-gradient(180deg, rgba(20, 20, 32, 0.6) 0%, rgba(10, 10, 20, 0.4) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      margin: 20px;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.6), transparent);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 20px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15);
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      margin: 0 0 16px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 999px;
      color: #00ff88;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.15;
      margin: 0 0 10px;
      background: linear-gradient(135deg, #ffffff 0%, #b8b8d0 50%, #8a8a9e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #8a8a9e;
      margin: 0 0 24px;
      line-height: 1.55;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto 4px;
      filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.3));
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 16px;
      display: none;
      padding: 12px 16px;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.2);
      border-radius: 10px;
      line-height: 1.5;
    }
    .btn {
      background: linear-gradient(135deg, #00ff88 0%, #00d96f 100%);
      color: #060610;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
      display: none;
      font-family: inherit;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 24px rgba(0, 255, 136, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(0, 255, 136, 0.35);
    }
    .btn:active { transform: translateY(0); }
    .success {
      color: #00ff88;
      font-size: 14px;
      margin-top: 12px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="favicon.png" alt="Degen Desk" class="logo" />
    <div class="eyebrow">Secure Sign In</div>
    <h1 id="title">Signing you in</h1>
    <p id="subtitle">Connecting your Google account to Degen Desk...</p>
    <div class="spinner" id="spinner"></div>
    <p class="error" id="error-msg"></p>
    <p class="success" id="success-msg">Returning to app...</p>
    <button class="btn" id="retry-btn">Try again</button>
  </div>

  <script>
    // =============================================
    // Google OAuth 2.0 Implicit Flow (OIDC)
    // =============================================
    // We bypass Firebase's signInWithRedirect because SFSafariViewController
    // breaks its multi-hop sessionStorage handshake (degendesk.xyz ->
    // firebaseapp.com -> Google -> back). Instead, we talk to Google directly
    // with response_type=id_token and hand the raw id_token back to the app
    // via a degendesk:// URL scheme. The app then calls signInWithCredential.

    const CLIENT_ID = "382072874801-gja50lcmh0nklj2qle9btqf4emqs4ab4.apps.googleusercontent.com";
    const REDIRECT_URI = "https://degendesk.xyz/auth-callback.html";
    const AUTH_ENDPOINT = "https://accounts.google.com/o/oauth2/v2/auth";

    const spinner = document.getElementById("spinner");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    const retryBtn = document.getElementById("retry-btn");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");

    function randomString(len) {
      const bytes = new Uint8Array(len);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    }

    function showError(msg) {
      spinner.style.display = "none";
      title.textContent = "Sign in failed";
      subtitle.textContent = "";
      errorMsg.style.display = "block";
      errorMsg.textContent = msg;
      retryBtn.textContent = "Try again";
      retryBtn.onclick = startGoogleSignIn;
      retryBtn.style.display = "inline-block";
    }

    function showSuccess() {
      spinner.style.display = "none";
      title.textContent = "Signed in!";
      subtitle.textContent = "";
      successMsg.style.display = "block";
    }

    function sendTokenToApp(idToken) {
      showSuccess();
      const url = "degendesk://auth?idToken=" + encodeURIComponent(idToken) + "&method=google";

      // Manual fallback button in case SFSafariViewController blocks the
      // automatic URL-scheme redirect.
      retryBtn.textContent = "Return to Degen Desk";
      retryBtn.onclick = () => { window.location.href = url; };
      retryBtn.style.display = "inline-block";

      setTimeout(() => { window.location.href = url; }, 500);
    }

    function startGoogleSignIn() {
      spinner.style.display = "block";
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
      retryBtn.style.display = "none";
      title.textContent = "Signing you in";
      subtitle.textContent = "Please wait while we connect your Google account...";

      const state = randomString(16);
      const nonce = randomString(16);
      try {
        sessionStorage.setItem("oauth_state", state);
      } catch (_) {}

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: "id_token",
        scope: "openid email profile",
        nonce: nonce,
        state: state,
        prompt: "select_account",
      });

      window.location.href = AUTH_ENDPOINT + "?" + params.toString();
    }

    function handleCallback() {
      // Google returns id_token in the URL fragment on success
      const hash = window.location.hash.startsWith("#")
        ? window.location.hash.substring(1)
        : "";
      const search = window.location.search.startsWith("?")
        ? window.location.search.substring(1)
        : "";

      // Errors come back in the query string
      if (search) {
        const sp = new URLSearchParams(search);
        const err = sp.get("error");
        if (err) {
          showError("Google: " + (sp.get("error_description") || err));
          return;
        }
      }

      if (!hash) {
        // First visit — kick off the OAuth flow
        startGoogleSignIn();
        return;
      }

      const frag = new URLSearchParams(hash);
      const idToken = frag.get("id_token");
      const returnedState = frag.get("state");
      const fragErr = frag.get("error");

      if (fragErr) {
        showError("Google: " + (frag.get("error_description") || fragErr));
        return;
      }

      if (!idToken) {
        startGoogleSignIn();
        return;
      }

      // Optional CSRF check — don't hard-fail if sessionStorage got cleared,
      // because Firebase will still verify the token's signature with Google
      // when the app calls signInWithCredential.
      try {
        const expected = sessionStorage.getItem("oauth_state");
        if (expected && returnedState && expected !== returnedState) {
          showError("Security check failed. Please try again.");
          return;
        }
      } catch (_) {}

      sendTokenToApp(idToken);
    }

    retryBtn.onclick = startGoogleSignIn;
    handleCallback();
  </script>
</body>
</html>
